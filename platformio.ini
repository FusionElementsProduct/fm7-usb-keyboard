; FM-7 キーボード -> USB HID 変換器
; ボード: Raspberry Pi Pico (RP2040)、3.3V のみの配線（レベルシフタなし）
; フレームワーク: arduino-pico（Earle Philhower コア）、maxgerhardt の platform-raspberrypi 経由
;
; 環境:
;   pico       変換器ファームウェア、6KRO ブートプロトコルレポート（デフォルト）
;   pico_nkro  変換器ファームウェア、21 バイトの NKRO ビットマップレポート
;   pico_diag  シリアル経由のマトリクス診断、USB HID なし
;
; 6KRO をデフォルトにしているのは、docs/fm7emulator.c が hid_keyboard_report_t
; （8 バイトのブートレポート）を読み、LED 状態をレポート 0 の 1 バイトとして
; 送るため。NKRO 専用のデバイスではエミュレータを操作できない。

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra

[env:pico]
board_build.usb_stack = tinyusb
lib_deps = adafruit/Adafruit TinyUSB Library@^3.1.0
build_flags =
    ${env.build_flags}
    -DUSE_TINYUSB
    -DFM7_NKRO=0
; USB 文字列はフレームワーク経由で設定する: 単純な -DUSB_PRODUCT は、
; platformio-build.py が後から追加するボードのデフォルト値（"Pico"）で上書きされる。
board_build.arduino.earlephilhower.usb_manufacturer = Fusion Elements
board_build.arduino.earlephilhower.usb_product = FM7USBKB-001

[env:pico_nkro]
board_build.usb_stack = tinyusb
lib_deps = adafruit/Adafruit TinyUSB Library@^3.1.0
build_flags =
    ${env.build_flags}
    -DUSE_TINYUSB
    -DFM7_NKRO=1
; USB 文字列はフレームワーク経由で設定する: 単純な -DUSB_PRODUCT は、
; platformio-build.py が後から追加するボードのデフォルト値（"Pico"）で上書きされる。
board_build.arduino.earlephilhower.usb_manufacturer = Fusion Elements
board_build.arduino.earlephilhower.usb_product = FM7USBKB-001

[env:pico_diag]
build_flags =
    ${env.build_flags}
    -DFM7_DIAGNOSTIC
